name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check reference behavior
        run: node evals/check.mjs examples/plain.mjs
      - name: Check museum exhibits
        run: node --test examples/museum.test.mjs
      - name: Check recorded Codex outputs
        run: |
          node evals/check.mjs evals/results/initial-codex/baseline.mjs
          node evals/check.mjs evals/results/initial-codex/with-skill.mjs
